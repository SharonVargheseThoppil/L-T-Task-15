apiVersion: apps/v1
kind: Deployment
metadata:
  name: task15-frontend
  labels:
    app: task15-frontend
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: task15-frontend

  template:
    metadata:
      labels:
        app: task15-frontend

    spec:
      containers:
        - name: frontend-container
          image: task15-cifar10-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501

          env:
            - name: API_URL
              value: "http://task15-api:5000"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5